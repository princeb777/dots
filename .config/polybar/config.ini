include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:eDP-1}
width = 98%
height = 26pt
offset-x = 1%
offset-y = 6pt
radius = 4

fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 1pt
border-color = ${colors.border}

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "DaddyTimeMono Nerd Font:size=10:weight=bold;2"
font-1 = "DaddyTimeMono Nerd Font:size=12;3"
font-2 = "DaddyTimeMono Nerd Font:size=8:weight=bold;2"

modules-left = bspwm sep-purple media
modules-center = date
modules-right = backlight sep-cyan pulseaudio sep-purple bluetooth sep-cyan network sep-purple warp sep-cyan wallpaper sep-purple restart shutdown

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; WM settings
wm-restack = bspwm
override-redirect = false

; ============================================
; MODULES
; ============================================

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = false
reverse-scroll = false
fuzzy-match = true

format = <label-state>

; Focused workspace: pure text, bright cyan, no square block or underline
label-focused = "%name%"
label-focused-foreground = ${colors.cyan}
label-focused-padding = 1

; Occupied workspace: pure text, standard foreground, no background
label-occupied = "%name%"
label-occupied-foreground = ${colors.foreground-alt}
label-occupied-padding = 1

; Urgent workspace
label-urgent = "%name%"
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

; Empty workspace -> Omit completely
label-empty =

[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 1
format = <label>
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous
scroll-up = playerctl position 5+
scroll-down = playerctl position 5-

[module/date]
type = internal/date
interval = 1.0
date = %a, %b %d
time = %I:%M %p
label = "%date%  %{F#00f0ff}%{F-}  %time%"
label-foreground = ${colors.foreground-alt}

[module/backlight]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/brightness.sh --status
initial = 1
format = <output>
scroll-up = ~/.config/polybar/scripts/brightness.sh --inc
scroll-down = ~/.config/polybar/scripts/brightness.sh --dec
click-left = ~/.config/polybar/scripts/brightness.sh --menu

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 2

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.purple}

format-muted = <label-muted>
label-muted = "󰝟 Muted"
label-muted-foreground = ${colors.subtext}

click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 3
format = <label>
click-left = ~/.config/polybar/scripts/rofi_bluetooth.sh
click-right = ~/.config/polybar/scripts/bluetooth_toggle.sh

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 3
format = <label>
click-left = ~/.config/polybar/scripts/rofi_wifi.sh
click-right = nm-connection-editor

[module/warp]
type = custom/script
exec = ~/.config/polybar/scripts/warp.sh
interval = 2
format = <label>
click-left = ~/.config/polybar/scripts/warp.sh --toggle

[module/wallpaper]
type = custom/text
format = " 󰸉 "
format-foreground = ${colors.magenta}
click-left = ~/.config/polybar/scripts/wallpaper_reload.sh

[module/restart]
type = custom/text
format = " 󰜉 "
format-foreground = ${colors.yellow}
click-left = ~/.config/polybar/scripts/powermenu.sh restart

[module/shutdown]
type = custom/text
format = " 󰐥 "
format-foreground = ${colors.magenta}
click-left = ~/.config/polybar/scripts/powermenu.sh shutdown

[module/sep-purple]
type = custom/text
format = "│"
format-foreground = ${colors.purple}
format-padding = 1

[module/sep-cyan]
type = custom/text
format = "│"
format-foreground = ${colors.cyan}
format-padding = 1
