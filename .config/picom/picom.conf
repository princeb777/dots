backend = "glx";
vsync = true;

# transparency
active-opacity = 1.0;
inactive-opacity = 0.8;

# smooth transitions
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# focus handling
detect-client-opacity = true;
corner-radius = 4;
# opacity rules
opacity-rule = [
    "100:fullscreen",
    "70:class_g = 'Spotify'"
];
